short_bio: >-
  <p>
    Wei Cai is a master's student in Software Engineering at the School of Software, University of Science and Technology of China.
    His work and interests cover multi-agent systems,  multi-objective optimization, deep learning and LLM.
  </p>
  <p>
    He is currently an AI intern at the Quantum Computing R&D Department of China Telecom Quantum Group, where he works on
    orchestration, tool safety, and context management for the Tianyan Qmind multi-agent delivery platform. Before that,
    he led the core optimization algorithm upgrade of the Anasage system, combining NSGA-II, clustering, anomaly detection,
    sensitivity analysis, and staged simulation control in Foohu Technology Company.
  </p>

